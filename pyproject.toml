[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dps-stac-item-generator"
description = "DPS algorithm for generating STAC item metadata for selected files from external sources"
readme = "README.md"
requires-python = ">=3.12"
version = "0.3.2"

dependencies = [
    "obstore>=0.8.2",
    "pystac>=1.14.1",
    "rio-cogeo>=7.0.0",
    "rio-stac>=0.10.1",
]

[project.scripts]
dps-stac-item-generator = "dps_stac_item_generator.cli:main"
happy-face-dps-demo = "dps_stac_item_generator.happy_face:main"

[dependency-groups]
dev = [
    "ipython>=9.8.0",
    "maap-py>=5.1.0",
    "mypy>=1.18.2",
    "pre-commit>=4.3.0",
    "pytest>=9.1.1",
    "ruff>=0.14.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-vv"

[tool.ruff]

[tool.ruff.format]
